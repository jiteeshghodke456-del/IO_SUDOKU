<body>
<div class="app" id="app">
  <header class="top">

      <svg width="38" height="38" viewBox="0 0 38 38" fill="none" stroke="#0B6B32" stroke-width="2.2" aria-hidden="true"><rect x="3" y="3" width="32" height="32" rx="5"/><path d="M13.7 3v32M24.3 3v32M3 13.7h32M3 24.3h32"/></svg>

  </div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
